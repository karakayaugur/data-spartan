name: Deploy Production

on:
  # Open this workflow manually from the Actions tab in GitHub.
  # push:
  # branches:
  # - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: data-spartan-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: data-spartan
  DEPLOYMENT_BUCKET: data-spartan-deployments-648632374176-eu-west-1
  INSTANCE_ID: i-0d4c46b3b644e40b8

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OIDC claims
        shell: python
        run: |
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += "&audience=sts.amazonaws.com"
          request = urllib.request.Request(url, headers={
              "Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          })
          token = json.load(urllib.request.urlopen(request))["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print(json.dumps({k: claims.get(k) for k in ["iss", "aud", "sub"]}, indent=2))

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::648632374176:role/data-spartan-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Upload deployment bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -czf "${RUNNER_TEMP}/deployment.tar.gz" \
            -C deployment compose.ec2.yml deploy.sh
          cd "${RUNNER_TEMP}"
          sha256sum deployment.tar.gz > deployment.tar.gz.sha256

          PREFIX="s3://${DEPLOYMENT_BUCKET}/deployments/data-spartan/${GITHUB_SHA}"
          aws s3 cp deployment.tar.gz "${PREFIX}/deployment.tar.gz"
          aws s3 cp deployment.tar.gz.sha256 "${PREFIX}/deployment.tar.gz.sha256"

      - name: Deploy through SSM
        shell: bash
        env:
          IMAGE_REF: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "${IMAGE_REF}" == *@sha256:* ]]

          PREFIX="s3://${DEPLOYMENT_BUCKET}/deployments/data-spartan/${GITHUB_SHA}"

          # Values come from this workflow and immutable GitHub commit metadata.
          COMMAND=$(cat <<EOF
          set -eu
          WORK=\$(mktemp -d /tmp/data-spartan-deploy.XXXXXX)
          trap 'rm -rf "\$WORK"' EXIT
          aws s3 cp '${PREFIX}/deployment.tar.gz' "\$WORK/deployment.tar.gz" --region '${AWS_REGION}'
          aws s3 cp '${PREFIX}/deployment.tar.gz.sha256' "\$WORK/deployment.tar.gz.sha256" --region '${AWS_REGION}'
          cd "\$WORK"
          sha256sum --check deployment.tar.gz.sha256
          mkdir release
          tar -xzf deployment.tar.gz -C release
          bash -n release/deploy.sh
          mkdir -p /opt/data-spartan/deploy
          install -m 644 release/compose.ec2.yml /opt/data-spartan/deploy/compose.ec2.yml
          install -m 700 release/deploy.sh /opt/data-spartan/deploy/deploy.sh
          export IMAGE_REF='${IMAGE_REF}'
          bash /opt/data-spartan/deploy/deploy.sh
          EOF
          )

          PARAMETERS=$(jq -n --arg command "${COMMAND}" \
            '{commands: [$command], executionTimeout: ["1200"]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --parameters "${PARAMETERS}" \
            --timeout-seconds 1200 \
            --query Command.CommandId --output text)

          echo "SSM command: ${COMMAND_ID}"

          for attempt in $(seq 1 130); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query Status --output text 2>/dev/null || echo Pending)

            echo "Status: ${STATUS}"
            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

          [[ "${STATUS}" == Success ]]
