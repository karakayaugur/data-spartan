<header class="film-header">
  <span class="film-header__eyebrow">EPISODE {{ film().episodeId }}</span>
  <h1>{{ film().episodeId }} - {{ film().title }}</h1>
  <p class="film-header__film-meta">
    {{ film().releaseDate | displayDate }} <span aria-hidden="true">·</span> Directed by {{
    film().director }}
  </p>
  <div class="film-header__viewing-count" aria-live="polite">
    <app-button
      [label]="'Watched ' + viewingCount() + (viewingCount() === 1 ? ' time' : ' times')"
      variant="neutral"
      size="small"
      ariaHasPopup="dialog"
      [ariaLabel]="
        'Open viewing log for ' + film().title + ', watched ' + viewingCount() + ' times'
      "
      (clicked)="openModal.emit()"
    ></app-button>
  </div>
</header>
