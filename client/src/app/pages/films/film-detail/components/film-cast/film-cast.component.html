<section class="cast" aria-label="Film cast">
  <div class="cast-layout">
    <div class="cast-list">
      @if (cast().length) {
        <ul aria-label="Cast members">
          @for (character of cast(); track character.id) {
            <li>
              <button
                class="character"
                type="button"
                (click)="openCharacter(character.id)"
                [class.selected]="selectedCharacterId() === character.id"
                [attr.aria-label]="
                  character.name + (selectedCharacterId() === character.id ? ', selected' : '')
                "
                aria-controls="character-details"
              >
                {{ character.name }}
              </button>
            </li>
          }
        </ul>
      } @else {
        <p>No cast information available.</p>
      }
    </div>
    <section id="character-details" class="character-details" aria-label="Character details">
      @if (selectedCharacterId(); as id) {
        <app-character-panel [characterId]="id"></app-character-panel>
      } @else {
        <p class="selection-hint">Select a cast member to see their details.</p>
      }
    </section>
  </div>
</section>
