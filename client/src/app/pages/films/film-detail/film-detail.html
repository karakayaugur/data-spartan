@if (loading()) {
<div class="film-detail__status" role="status">Loading film…</div>
} @else if (film(); as selected) {
<article>
  <app-film-header
    [film]="selected"
    [viewingCount]="viewingCount()"
    (openModal)="openViewingModal()"
  ></app-film-header>

  <app-film-crawl [crawlText]="selected.openingCrawl"></app-film-crawl>

  @if (castLoading()) {
  <div class="film-detail__cast-loading">Loading characters...</div>
  } @else {
  <app-film-cast [cast]="cast()"></app-film-cast>
  }
</article>
}
