@if (loading()) {
<ng-container [ngTemplateOutlet]="loadingTemplate"></ng-container>
} @else if (film(); as selected) {
<article>
  <app-film-header
    [film]="selected"
    [viewingCount]="viewingCount()"
    (openModal)="openViewingModal()"
  ></app-film-header>
  <app-film-crawl [crawlText]="selected.openingCrawl"></app-film-crawl>
  <app-film-cast [cast]="selected.cast"></app-film-cast>
</article>
}
<ng-template #loadingTemplate>
  <div class="film-detail__status" role="status">Loading film and cast…</div>
</ng-template>
