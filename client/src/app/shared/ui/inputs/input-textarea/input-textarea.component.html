<div class="input-container">
  <label class="label" [for]="inputId()"
    >{{ label() }}
    @if (required()) {
      <span class="required-indicator">*</span>
    }
  </label>
  <div class="input-wrap">
    <textarea
      [class.input-invalid]="hasError() || error()"
      [attr.aria-invalid]="!!(hasError() || error())"
      [attr.aria-describedby]="error() ? inputId() + '-error' : null"
      [id]="inputId()"
      [name]="name()"
      [value]="value()"
      [placeholder]="placeholder()"
      [readonly]="readonly()"
      [rows]="rows()"
      [attr.maxlength]="maxLength()"
      (input)="onInput($event)"
    ></textarea>
  </div>
  @if (remaining() !== null) {
    <span class="char-counter" [class.at-limit]="remaining()! <= 0">
      {{ remaining() }} characters remaining
    </span>
  }
  @if (error()) {
    <app-input-feedback
      [message]="error()"
      [feedbackId]="inputId() + '-error'"
    ></app-input-feedback>
  }
</div>
