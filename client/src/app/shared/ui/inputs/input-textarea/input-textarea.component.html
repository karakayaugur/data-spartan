<div class="input-textarea__input-container">
  <label class="input-textarea__label" [for]="inputId()"
    >{{ label() }}
    @if (required()) {
      <span class="input-textarea__required-indicator">*</span>
    }
  </label>
  <div class="input-textarea__input-wrap">
    <textarea
      [class.input-textarea__input-invalid]="hasError() || error()"
      [attr.aria-invalid]="!!(hasError() || error())"
      [attr.aria-describedby]="error() ? inputId() + '-error' : null"
      [id]="inputId()"
      [name]="name()"
      [value]="value()"
      [placeholder]="placeholder()"
      [readonly]="readonly()"
      [rows]="rows()"
      [attr.maxlength]="maxLength()"
      (input)="onInput($event)"
    ></textarea>
  </div>
  @if (remaining() !== null) {
    <span
      class="input-textarea__char-counter"
      [class.input-textarea__char-counter--at-limit]="remaining()! <= 0"
    >
      {{ remaining() }} characters remaining
    </span>
  }
  @if (error()) {
    <app-input-feedback
      [message]="error()"
      [feedbackId]="inputId() + '-error'"
    ></app-input-feedback>
  }
</div>
