<div class="input-container">
  <label class="label" [for]="inputId()"
    >{{ label() }}
    @if (required()) {
      <span class="required-indicator">*</span>
    }
  </label>
  <div class="input-wrap">
    <textarea
      [class.input-invalid]="hasError() || error()"
      [id]="inputId()"
      [name]="name()"
      [value]="value()"
      [placeholder]="placeholder()"
      [readonly]="readonly()"
      [rows]="rows()"
      [attr.maxlength]="maxLength()"
      (input)="onInput($event)"
    ></textarea>
    @if (error()) {
      <svg
        class="error-icon"
        lucideIcon="circle-alert"
        [size]="20"
        [strokeWidth]="2"
        aria-hidden="true"
      ></svg>
    }
  </div>
  @if (remaining() !== null) {
    <span class="char-counter" [class.at-limit]="remaining()! <= 0">
      {{ remaining() }} characters remaining
    </span>
  }
  @if (error()) {
    <div class="feedback">
      <svg
        class="error-icon"
        lucideIcon="x"
        [size]="16"
        [strokeWidth]="2"
        aria-hidden="true"
      ></svg>
      <p role="alert">{{ error() }}</p>
    </div>
  }
</div>
