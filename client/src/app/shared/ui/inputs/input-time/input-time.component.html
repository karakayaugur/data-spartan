<div class="input-time__input-container">
  <label class="input-time__label" [for]="inputId()"
    >{{ label() }}
    @if (required()) {
      <span class="input-time__required-indicator" aria-hidden="true">*</span>
    }
  </label>
  @if (open()) {
    <button
      class="input-time__backdrop"
      type="button"
      aria-label="Close picker"
      (click)="close()"
    ></button>
  }
  <div class="input-time__wrap">
    <div class="input-time__field">
      <input
        class="input-time__input"
        [class.input-time__input--invalid]="error()"
        type="text"
        autocomplete="off"
        [id]="inputId()"
        [value]="draft() ?? value()"
        placeholder="hh:mm"
        [required]="required()"
        [attr.aria-invalid]="!!error()"
        [attr.aria-describedby]="error() ? inputId() + '-error' : null"
        (input)="editTime($event)"
        (blur)="commitTime()"
        (keydown.enter)="onTimeEnter($event)"
      />
      <button
        class="input-time__toggle"
        type="button"
        aria-label="Choose time"
        aria-haspopup="dialog"
        [attr.aria-expanded]="open()"
        [attr.aria-controls]="open() ? inputId() + '-picker' : null"
        (click)="toggle($event)"
      >
        <svg
          class="input-time__icon"
          lucideIcon="clock"
          [size]="18"
          [strokeWidth]="1.75"
          aria-hidden="true"
        ></svg>
      </button>
    </div>
    @if (open()) {
      <div
        class="input-time__dropdown"
        role="dialog"
        [id]="inputId() + '-picker'"
        aria-label="Choose time"
      >
        <div class="input-time__columns">
          <div class="input-time__column">
            <h3 [id]="inputId() + '-hours'">Hour</h3>
            <div
              class="input-time__options"
              role="group"
              [attr.aria-labelledby]="inputId() + '-hours'"
            >
              @for (hour of hours; track hour) {
                <button
                  class="input-time__option"
                  type="button"
                  [class.input-time__option--selected]="selectedHour() === hour"
                  [attr.aria-pressed]="selectedHour() === hour"
                  (click)="selectTime('hour', hour)"
                >
                  {{ hour }}
                </button>
              }
            </div>
          </div>
          <div class="input-time__column">
            <h3 [id]="inputId() + '-minutes'">Minute</h3>
            <div
              class="input-time__options"
              role="group"
              [attr.aria-labelledby]="inputId() + '-minutes'"
            >
              @for (minute of minutes; track minute) {
                <button
                  class="input-time__option"
                  type="button"
                  [class.input-time__option--selected]="selectedMinute() === minute"
                  [attr.aria-pressed]="selectedMinute() === minute"
                  (click)="selectTime('minute', minute)"
                >
                  {{ minute }}
                </button>
              }
            </div>
          </div>
        </div>
      </div>
    }
  </div>
  @if (error()) {
    <app-input-feedback
      [message]="error()"
      [feedbackId]="inputId() + '-error'"
    ></app-input-feedback>
  }
  <input type="hidden" [name]="name()" [value]="value()" />
</div>
