<div class="input-date__input-container">
  <label class="input-date__label" [for]="inputId()">
    {{ label() }}
    @if (required()) {
      <span class="input-date__required-indicator" aria-hidden="true">*</span>
    }
  </label>
  @if (open()) {
    <button
      type="button"
      class="input-date__backdrop"
      aria-label="Close picker"
      (click)="close()"
    ></button>
  }
  <div class="input-date__picker-wrap" [class.input-date__picker-wrap--open]="open()">
    <button
      type="button"
      class="input-date__trigger"
      [class.input-date__trigger--invalid]="error()"
      [id]="inputId()"
      [attr.aria-expanded]="open()"
      [attr.aria-controls]="open() ? inputId() + '-picker' : null"
      [attr.aria-invalid]="!!error()"
      [attr.aria-describedby]="error() ? inputId() + '-error' : null"
      aria-haspopup="dialog"
      (click)="toggle($event)"
    >
      @if (displayValue()) {
        <span class="input-date__value">{{ displayValue() }}</span>
      } @else {
        <span class="input-date__placeholder">dd / mm / yyyy</span>
      }
      <svg
        class="input-date__icon"
        lucideIcon="calendar"
        [size]="18"
        [strokeWidth]="1.75"
        aria-hidden="true"
      ></svg>
    </button>
    @if (open()) {
      <div
        class="input-date__dropdown"
        role="dialog"
        [id]="inputId() + '-picker'"
        aria-label="Choose date"
      >
        <div class="input-date__calendar-header">
          <select
            class="input-date__month-select"
            [value]="viewMonth()"
            aria-label="Month"
            (change)="onMonthChange($event)"
          >
            @for (month of months; track month; let index = $index) {
              <option [value]="index">{{ month }}</option>
            }
          </select>

          <select
            class="input-date__year-select"
            [value]="viewYear()"
            aria-label="Year"
            (change)="onYearChange($event)"
          >
            @for (year of years(); track year) {
              <option [value]="year">{{ year }}</option>
            }
          </select>
        </div>

        <div class="input-date__weekdays" aria-hidden="true">
          @for (weekday of weekdays; track weekday) {
            <span class="input-date__weekday">{{ weekday }}</span>
          }
        </div>

        <div class="input-date__days" role="grid">
          @for (day of calendarDays(); track day.iso) {
            <button
              type="button"
              class="input-date__day"
              role="gridcell"
              [class.input-date__day--muted]="!day.inMonth"
              [class.input-date__day--selected]="isSelected(day)"
              [class.input-date__day--today]="isToday(day)"
              (click)="selectDay(day)"
            >
              {{ day.date.getDate() }}
            </button>
          }
        </div>
      </div>
    }
  </div>
  @if (error()) {
    <app-input-feedback
      [message]="error()"
      [feedbackId]="inputId() + '-error'"
    ></app-input-feedback>
  }
  <input type="hidden" [name]="name()" [value]="value()" />
</div>
