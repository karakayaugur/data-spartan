<div class="input-container">
  <label class="label" [for]="inputId()">
    {{ label() }}
    @if (required()) { <span class="required-indicator" aria-hidden="true">*</span> }
  </label>
  @if (open()) {
    <button type="button" class="date-backdrop" aria-label="Close picker" (click)="close()"></button>
  }
  <div class="picker-wrap" [class.picker-wrap--open]="open()">
    <button type="button" class="date-trigger" [class.input-invalid]="error()" [id]="inputId()"
      [attr.aria-expanded]="open()" [attr.aria-controls]="open() ? inputId() + '-picker' : null"
      [attr.aria-invalid]="!!error()" [attr.aria-describedby]="error() ? inputId() + '-error' : null"
      aria-haspopup="dialog" (click)="toggle($event)">
      @if (displayValue()) { <span class="date-value">{{ displayValue() }}</span> }
      @else { <span class="date-placeholder">dd / mm / yyyy</span> }
      <svg class="date-icon" lucideIcon="calendar" [size]="18" [strokeWidth]="1.75" aria-hidden="true"></svg>
    </button>
    @if (open()) {
      <div class="date-dropdown" role="dialog"
        [id]="inputId() + '-picker'" aria-label="Choose date">
        <div class="calendar-header">
          <select
            class="month-select"
            [value]="viewMonth()"
            aria-label="Month"
            (change)="onMonthChange($event)"
          >
            @for (month of months; track month; let index = $index) {
              <option [value]="index">{{ month }}</option>
            }
          </select>

          <select
            class="year-select"
            [value]="viewYear()"
            aria-label="Year"
            (change)="onYearChange($event)"
          >
            @for (year of years(); track year) {
              <option [value]="year">{{ year }}</option>
            }
          </select>
        </div>

        <div class="weekdays" aria-hidden="true">
          @for (weekday of weekdays; track weekday) {
            <span class="weekday">{{ weekday }}</span>
          }
        </div>

        <div class="days" role="grid">
          @for (day of calendarDays(); track day.iso) {
            <button
              type="button"
              class="day"
              role="gridcell"
              [class.day--muted]="!day.inMonth"
              [class.day--selected]="isSelected(day)"
              [class.day--today]="isToday(day)"
              (click)="selectDay(day)"
            >
              {{ day.date.getDate() }}
            </button>
          }
        </div>
      </div>
    }
  </div>
  @if (error()) {
    <app-input-feedback [message]="error()" [feedbackId]="inputId() + '-error'"></app-input-feedback>
  }
  <input type="hidden" [name]="name()" [value]="value()">
</div>
