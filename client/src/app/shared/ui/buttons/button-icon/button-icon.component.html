<button
  [attr.type]="type()"
  [attr.aria-label]="ariaLabel()"
  [attr.data-size]="size()"
  [disabled]="loading() || disabled()"
  (click)="onClick()"
>
  @if (loading()) {
    <div class="loader"></div>
  } @else {
    <svg
      [lucideIcon]="icon()"
      [size]="iconSize"
      [strokeWidth]="2"
      aria-hidden="true"
    ></svg>
  }
</button>
