<button
  [attr.cdkFocusInitial]="focusInitial() ? '' : null"
  cdkMonitorElementFocus
  [attr.type]="type()"
  [attr.aria-controls]="ariaControls()"
  [attr.aria-expanded]="ariaExpanded()"
  [attr.aria-haspopup]="ariaHasPopup()"
  [attr.aria-label]="ariaLabel() ?? (iconOnly() ? displayLabel() : null)"
  [attr.data-icon-only]="iconOnly() ? true : null"
  [attr.aria-busy]="loading() ? true : null"
  [attr.data-variant]="variant()"
  [attr.data-size]="size()"
  [attr.data-loading]="loading() ? true : null"
  [disabled]="loading() || disabled()"
  (click)="onClick()"
>
  @if (loading()) {
    <svg
      class="spinner"
      lucideIcon="loader-circle"
      [size]="iconSize"
      [strokeWidth]="2"
      aria-hidden="true"
    ></svg>
  } @else if (icon() && (iconOnly() || iconPosition() === "start")) {
    <svg [lucideIcon]="icon()!" [size]="iconSize" [strokeWidth]="2" aria-hidden="true"></svg>
  }
  @if (!iconOnly()) {
    <span class="label">{{ displayLabel() }}</span>
  }
  @if (!iconOnly() && !loading() && icon() && iconPosition() === "end") {
    <svg [lucideIcon]="icon()!" [size]="iconSize" [strokeWidth]="2" aria-hidden="true"></svg>
  }
</button>
