<div class="modal" [attr.data-size]="size()">
  <header class="modal__header">
    <h3>{{ title() }}</h3>
    <app-button
      icon="x"
      [iconOnly]="true"
      variant="neutral"
      size="medium"
      ariaLabel="Close modal"
      (clicked)="close()"
      class="modal__close-button"
    ></app-button>
  </header>
  <div class="modal__body">
    <ng-content></ng-content>
  </div>
</div>
