<app-modal
  [title]="film.title + ' (' + (film.releaseDate | date: 'MMM d, yyyy') + ')'"
  size="small"
>
  <form class="viewing-log__form" (submit)="onSubmit(); $event.preventDefault()" novalidate>
    <app-input-picker
      inputId="viewing-date"
      label="Date"
      [min]="film.releaseDate"
      [max]="today"
      ear
      [(value)]="form.date"
    ></app-input-picker>
    <app-input-picker
      inputId="viewing-time"
      type="time"
      label="Time"
      [(value)]="form.time"
    ></app-input-picker>
    <app-input-textarea
      inputId="viewing-description"
      label="Description"
      [required]="false"
      [rows]="2"
      [(value)]="form.description"
    ></app-input-textarea>
    <app-button label="Add viewing" icon="plus" type="submit"></app-button>
  </form>

  @if(viewings()[0]){
  <ng-container [ngTemplateOutlet]="viewingTemplate"></ng-container>
  }
</app-modal>

<ng-template #viewingTemplate>
  <section aria-labelledby="history-title">
    <h3 id="history-title" tabindex="-1">Recorded viewings ({{ viewings().length }})</h3>
    <div aria-live="polite">
      @for (viewing of viewings(); track viewing.id) {
      <article class="viewing-log__viewing">
        <div class="viewing-log__viewing-copy">
          <time [attr.datetime]="viewing.date + 'T' + viewing.time"
            >{{ viewing.date | date: "MMM d, yyyy" }}, {{ viewing.time }}</time
          >@if (viewing.description) {
          <p>{{ viewing.description }}</p>
          }
        </div>
        <app-button
          class="viewing-log__delete"
          label="Delete"
          icon="trash-2"
          variant="danger"
          size="small"
          [ariaLabel]="'Delete viewing on ' + viewing.date + ' at ' + viewing.time"
          (clicked)="remove(viewing.id)"
        ></app-button>
      </article>
      } @empty {
      <p class="viewing-log__empty">No viewings recorded yet.</p>
      }
    </div>
  </section>
</ng-template>
