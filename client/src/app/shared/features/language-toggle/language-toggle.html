<div class="lang-menu" [class.open]="open()">
  <button
    type="button"
    class="lang-trigger"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
    aria-label="Select language"
    (click)="toggle($event)"
  >
    <span>{{ currentShort() }}</span>
    <svg
      class="chevron"
      lucideIcon="chevron-down"
      [size]="14"
      [strokeWidth]="2"
      aria-hidden="true"
    ></svg>
  </button>

  @if (open()) {
    <ul class="lang-dropdown" role="listbox" [attr.aria-label]="'Language'">
      @for (option of options; track option.value) {
        <li>
          <button
            type="button"
            class="lang-option"
            role="option"
            [attr.aria-selected]="locale() === option.value"
            [class.active]="locale() === option.value"
            (click)="select(option.value, $event)"
          >
            <span class="lang-short">{{ option.short }}</span>
            <span class="lang-label">{{ option.label }}</span>
          </button>
        </li>
      }
    </ul>
  }
</div>
