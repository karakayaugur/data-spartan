<div class="capsule">
  <app-sidebar [mobileOpen]="nav.open()" (closeMenu)="nav.close()"></app-sidebar>
  <main class="main" id="main-content" [inert]="nav.open()">
    <app-button
      class="menu-toggle"
      icon="menu"
      [iconOnly]="true"
      variant="neutral"
      size="large"
      ariaLabel="Open menu"
      ariaControls="film-sidebar"
      [ariaExpanded]="nav.open()"
      (clicked)="nav.toggle()"
    >
    </app-button>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
