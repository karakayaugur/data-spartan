<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Badge Examples</title>
    <link rel="stylesheet" href="https://unpkg.com/open-props" />
    <style>
      /* ---- Theme tokens (standalone) ---- */
      :root {
        --white: hsl(0, 0%, 100%);
        --brand: var(--indigo-5);
        --text-1: var(--gray-9);
        --text-2: var(--gray-7);
        --surface-1: var(--gray-0);
        --surface-2: var(--gray-1);
        --surface-3: var(--gray-2);
        --surface-4: var(--gray-3);
      }

      /* @media (prefers-color-scheme: dark) {
        :root {
          --brand: var(--indigo-4);
          --text-1: var(--gray-2);
          --text-2: var(--gray-5);
          --surface-1: var(--gray-12);
          --surface-2: var(--gray-11);
          --surface-3: var(--gray-10);
          --surface-4: var(--gray-9);
        }
      } */

      /* ---- Badges ---- */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: var(--size-1);
        padding-inline: var(--size-2);
        padding-block: var(--size-1);
        font-size: var(--font-size-0);
        font-weight: var(--font-weight-5);
        line-height: 1;
        white-space: nowrap;
        border-radius: var(--radius-round);
        border: 1px solid transparent;
      }

      .badge-neutral {
        background: var(--surface-3);
        color: var(--text-2);
        border-color: var(--surface-4);
      }

      .badge-brand {
        background: color-mix(in oklch, var(--brand) 15%, transparent);
        color: var(--brand);
        border-color: color-mix(in oklch, var(--brand) 30%, transparent);
      }

      .badge-success {
        background: color-mix(in oklch, var(--green-6) 15%, transparent);
        color: var(--green-7);
        border-color: color-mix(in oklch, var(--green-6) 30%, transparent);
      }

      .badge-warning {
        background: color-mix(in oklch, var(--yellow-5) 15%, transparent);
        color: var(--yellow-9);
        border-color: color-mix(in oklch, var(--yellow-5) 30%, transparent);
      }

      .badge-danger {
        background: color-mix(in oklch, var(--red-6) 15%, transparent);
        color: var(--red-7);
        border-color: color-mix(in oklch, var(--red-6) 30%, transparent);
      }

      .badge-info {
        background: color-mix(in oklch, var(--blue-5) 15%, transparent);
        color: var(--blue-7);
        border-color: color-mix(in oklch, var(--blue-5) 30%, transparent);
      }

      .badge-sm {
        padding-inline: var(--size-1);
        padding-block: 2px;
        font-size: var(--font-size-00);
      }

      .badge-lg {
        padding-inline: var(--size-3);
        padding-block: var(--size-2);
        font-size: var(--font-size-1);
      }

      .badge-dot::before {
        content: "";
        inline-size: 6px;
        block-size: 6px;
        border-radius: var(--radius-round);
        background: currentColor;
        flex-shrink: 0;
      }

      .badge-solid.badge-neutral {
        background: var(--surface-4);
        color: var(--text-1);
        border-color: transparent;
      }

      .badge-solid.badge-brand {
        background: var(--brand);
        color: var(--white);
        border-color: transparent;
      }

      .badge-solid.badge-success {
        background: var(--green-7);
        color: var(--white);
        border-color: transparent;
      }

      .badge-solid.badge-warning {
        background: var(--yellow-5);
        color: var(--gray-9);
        border-color: transparent;
      }

      .badge-solid.badge-danger {
        background: var(--red-7);
        color: var(--white);
        border-color: transparent;
      }

      .badge-solid.badge-info {
        background: var(--blue-7);
        color: var(--white);
        border-color: transparent;
      }

      /* ---- Page layout ---- */
      body {
        font-family: system-ui, sans-serif;
        padding: 2rem;
        background: var(--surface-1);
        color: var(--text-1);
      }
      section {
        margin-block-end: 2rem;
      }
      h2 {
        margin-block-end: 0.75rem;
        font-size: 1rem;
        color: var(--text-2);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <section>
      <h2>Subtle (default)</h2>
      <div class="row">
        <span class="badge badge-neutral">Neutral</span>
        <span class="badge badge-brand">Brand</span>
        <span class="badge badge-success">Success</span>
        <span class="badge badge-warning">Warning</span>
        <span class="badge badge-danger">Danger</span>
        <span class="badge badge-info">Info</span>
      </div>
    </section>

    <section>
      <h2>With Dot</h2>
      <div class="row">
        <span class="badge badge-success badge-dot">Active</span>
        <span class="badge badge-danger badge-dot">Blocked</span>
        <span class="badge badge-warning badge-dot">Pending</span>
        <span class="badge badge-info badge-dot">Processing</span>
        <span class="badge badge-neutral badge-dot">Draft</span>
      </div>
    </section>

    <section>
      <h2>Solid (high emphasis)</h2>
      <div class="row">
        <span class="badge badge-solid badge-neutral">Neutral</span>
        <span class="badge badge-solid badge-brand">Brand</span>
        <span class="badge badge-solid badge-success">Success</span>
        <span class="badge badge-solid badge-warning">Warning</span>
        <span class="badge badge-solid badge-danger">Danger</span>
        <span class="badge badge-solid badge-info">Info</span>
      </div>
    </section>

    <section>
      <h2>Sizes</h2>
      <div class="row">
        <span class="badge badge-brand badge-sm">Small</span>
        <span class="badge badge-brand">Default</span>
        <span class="badge badge-brand badge-lg">Large</span>
      </div>
    </section>

    <section>
      <h2>Solid + Dot + Size combinations</h2>
      <div class="row">
        <span class="badge badge-solid badge-success badge-dot badge-sm"
          >Verified</span
        >
        <span class="badge badge-solid badge-danger badge-dot">Failed</span>
        <span class="badge badge-solid badge-info badge-dot badge-lg"
          >Syncing</span
        >
      </div>
    </section>
  </body>
</html>
